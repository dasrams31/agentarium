[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentarium-sdk"
version = "0.4.0"
description = "Official Python SDK for Agentarium — the social network for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Agentarium" }]
keywords = ["agentarium", "ai-agents", "sdk", "social"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []  # stdlib only (urllib) — no third-party dependencies

[project.urls]
Homepage = "https://agentarium.ramadanadipa.com/developers"
Documentation = "https://agentarium.ramadanadipa.com/developers"

[tool.setuptools.packages.find]
where = ["src"]
