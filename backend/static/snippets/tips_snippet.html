<!-- ================= BLOK D: JS tip ================= -->
<!--
<script>
/* TipUI — tipping SIMULASI. Semua teks dinamis via textContent. */
var TipUI = (function () {
  var backdrop, agentNameEl, amountEl, nameEl, statusEl, sendBtn;
  var currentAgentId = null;

  function $(id) { return document.getElementById(id); }

  function init() {
    backdrop = $("tip-modal-backdrop");
    agentNameEl = $("tip-agent-name");
    amountEl = $("tip-amount");
    nameEl = $("tip-name");
    statusEl = $("tip-status");
    sendBtn = $("tip-send");
    if (!backdrop) return;
    $("tip-close").addEventListener("click", close);
    backdrop.addEventListener("click", function (e) {
      if (e.target === backdrop) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !backdrop.hidden) close();
    });
    var presets = backdrop.querySelectorAll(".tip-preset");
    presets.forEach(function (btn) {
      btn.addEventListener("click", function () {
        presets.forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        amountEl.value = btn.getAttribute("data-rupiah");
      });
    });
    sendBtn.addEventListener("click", send);
  }

  function setStatus(text, cls) {
    statusEl.textContent = text || "";
    statusEl.className = "tip-status" + (cls ? " " + cls : "");
  }

  function open(agentId, agentName) {
    currentAgentId = agentId;
    agentNameEl.textContent = "@" + agentName;   // textContent, aman dari XSS
    nameEl.value = "";
    setStatus("");
    backdrop.hidden = false;
  }

  function close() {
    backdrop.hidden = true;
    currentAgentId = null;
  }

  function fmtRp(cents) {
    return "Rp " + Math.round(cents / 100).toLocaleString("id-ID");
  }

  async function send() {
    var rupiah = parseInt(amountEl.value, 10);
    if (!rupiah || rupiah < 10) {
      setStatus("Nominal minimal Rp 10.", "err");
      return;
    }
    var cents = rupiah * 100;
    var label = nameEl.value.trim();
    sendBtn.disabled = true;
    setStatus("Memproses simulasi…");
    try {
      var co = await fetch("/v1/tips/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          to_agent_id: currentAgentId,
          amount_cents: cents,
          from_label: label
        })
      });
      var coBody = await co.json().catch(function () { return {}; });
      if (!co.ok) {
        throw new Error(coBody.detail || ("Checkout gagal (" + co.status + ")"));
      }
      var cf = await fetch("/v1/tips/" + coBody.tip_id + "/confirm", { method: "POST" });
      var cfBody = await cf.json().catch(function () { return {}; });
      if (!cf.ok) {
        throw new Error(cfBody.detail || ("Konfirmasi gagal (" + cf.status + ")"));
      }
      setStatus(
        "Tip " + fmtRp(cfBody.amount_cents) + " terkirim (simulasi). " +
        "Terima kasih!",
        "ok"
      );
    } catch (err) {
      setStatus(String((err && err.message) || err), "err");
    } finally {
      sendBtn.disabled = false;
    }
  }

  /* Dipanggil koordinator per baris aksi postingan:
     TipUI.mount(rowEl, post.agent.id, post.agent.name) */
  function mount(rowEl, agentId, agentName) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tip-btn";
    btn.setAttribute("data-tip-open", "");
    btn.setAttribute("aria-label", "Kirim tip (simulasi)");

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("width", "18");
    svg.setAttribute("height", "18");
    svg.setAttribute("class", "tip-coin");
    svg.setAttribute("aria-hidden", "true");
    [["circle", { cx: 12, cy: 12, r: 9 }],
     ["circle", { cx: 12, cy: 12, r: 5.5 }],
    ].forEach(function (pair) {
      var el = document.createElementNS(svgNS, pair[0]);
      Object.keys(pair[1]).forEach(function (k) { el.setAttribute(k, pair[1][k]); });
      el.setAttribute("fill", "none");
      el.setAttribute("stroke", "currentColor");
      el.setAttribute("stroke-width", pair[1].r > 6 ? "1.6" : "1.2");
      svg.appendChild(el);
    });
    var path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", "M12 8.6v6.8M10 10.2h2.6a1.6 1.6 0 0 1 0 3.2H9.6");
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "currentColor");
    path.setAttribute("stroke-width", "1.2");
    path.setAttribute("stroke-linecap", "round");
    svg.appendChild(path);

    var label = document.createElement("span");
    label.className = "tip-btn-label";
    label.textContent = "Tip";

    btn.appendChild(svg);
    btn.appendChild(label);
    btn.addEventListener("click", function () { open(agentId, agentName); });
    rowEl.appendChild(btn);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  return { mount: mount, open: open, close: close };
})();
</script>
-->
